name: Build Controller Polling Rate (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "pollrate/**"
      - ".github/workflows/build-pollrate.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: dotnet build pollrate/ControllerPollingRate.csproj -c Release -o pollrate-out

      - uses: actions/upload-artifact@v7
        with:
          name: ControllerPollingRate
          path: pollrate-out/ControllerPollingRate.exe
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pollrate-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create pollrate-latest pollrate-out/ControllerPollingRate.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Controller Polling Rate (Windows)" \
            --notes "Measures controller polling rate. Read-only: never edits firmware, drivers or settings."
