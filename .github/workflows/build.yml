name: Build TpllKit (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-ios:
    name: iOS
    runs-on: macos-latest
    permissions:
      contents: write # needed to publish the release below

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: minimal
          target: iOS
          sdk: given # uses the "geode" version in minimal/mod.json (5.11.2)
          # Geode 5.11.2 normally downloads the bindings "main" branch, which has since moved
          # on to the next Geode generation and no longer compiles with 5.11.2.
          # This pins the bindings to the last commit before the 5.11.2 release (2026-10-15).
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          # Build the code generator from that same bindings commit instead of downloading
          # the latest prebuilt one, whose output format no longer matches.
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - name: Upload .geode file
        uses: actions/upload-artifact@v7
        with:
          name: TpllKit-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Publish as a downloadable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls "${{ steps.build.outputs.build-output }}"/*.geode | head -n 1)
          gh release delete tpllkit-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create tpllkit-latest "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TpllKit (latest build)" \
            --notes "Latest iOS build of TpllKit for Geode 5.11.2 / GD 2.2081. Download the .geode file below."
