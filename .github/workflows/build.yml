name: Build TpllKit

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build iOS Mod
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TpllKit
        uses: geode-sdk/build-geode-mod@main
        with:
          path: minimal
          target: iOS
          combine: true