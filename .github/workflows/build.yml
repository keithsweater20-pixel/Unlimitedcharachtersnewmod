name: Build TpllKit (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: minimal
          target: iOS
          sdk: given # uses the "geode" version in minimal/mod.json (5.11.2)

      - name: Upload .geode file
        uses: actions/upload-artifact@v7
        with:
          name: TpllKit-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
