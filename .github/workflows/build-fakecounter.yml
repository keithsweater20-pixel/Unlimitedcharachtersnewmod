name: Build Fake FPS & CPS Counter (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "fakecounter/**"
      - ".github/workflows/build-fakecounter.yml"

jobs:
  # Exactly as requested: Geode SDK 4.6.0 (bindings from the 4.6.0 release time).
  geode-4-6-0:
    name: Windows - Geode 4.6.0
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: fakecounter
          target: Win64
          sdk: given
          bindings-ref: e24d13af33ea28c314182aecc757317ba9e8610a
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v7
        with:
          name: FakeCounter-Windows-Geode4.6.0
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls "${{ steps.build.outputs.build-output }}"/*.geode | head -n 1)
          gh release delete fakecounter-geode4 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create fakecounter-geode4 "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fake FPS & CPS Counter (Windows, Geode 4.6.0)" \
            --notes "Windows build made with Geode SDK 4.6.0."

  # Same source built for Geode 5.x loaders (GD 2.2081 is supported by Geode 4.10+/5.x).
  geode-5:
    name: Windows - Geode 5.11.2
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Retarget mod.json to Geode 5.11.2
        shell: bash
        run: |
          sed -i 's/"geode": "4.6.0"/"geode": "5.11.2"/' fakecounter/mod.json

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: fakecounter
          target: Win64
          sdk: given
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v7
        with:
          name: FakeCounter-Windows-Geode5
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls "${{ steps.build.outputs.build-output }}"/*.geode | head -n 1)
          gh release delete fakecounter-geode5 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create fakecounter-geode5 "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fake FPS & CPS Counter (Windows, Geode 5.11.2)" \
            --notes "Windows build made with Geode SDK 5.11.2."
